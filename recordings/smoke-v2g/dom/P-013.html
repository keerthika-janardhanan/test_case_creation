  padding-left: 50px;

.headerclass-consent {
  width: 100%;
  background-color: #3A3632;
  background-color: var(--alloy-chBgBase, #3A3632);
  color: #FCFBFA;
  color: var(--alloy-chFgBase, #FCFBFA);
  padding: 15px 20px 0 46px;
  height: 40px;
  font-size: 18px;
  line-height: 30px;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);  
}
@media all and (max-width: 650px) {
  .oj-consent-page-shell-rw {
    align-items: flex-start;
  }
  .oj-consent-page-shell-wrapper-rw {
    margin: 0 0;
    width: 100vw;
    padding: 50px 0px;
  }
  .oj-consent-page-shell-padding-left-rw {
    padding-left: 17px;
  }
  .oj-consent-page-shell-padding-right-rw {
    padding-right: 17px;
  }
}
.consent-page-create-account-button {
  background-color: #312d2a;
  background-color: var(--alloy-primaryBase, #312d2a);
  background-image: none;
  border-color: transparent;
  color: #fff;
  text-shadow: none;
}
.consent-page-cancel-button {
  background-color: #FFFFFF;
  color: #161513;
  border-radius: 4px;
  border-color: #161513;
  cursor: pointer;
}
.oj-subscription-opt-out {
  color: #161513;
  font-size: 12px;
  margin-bottom: 6px;
}oj-idaas-customer-signin-create-account-section .oj-idaas-customer-signin-create-account-section {

	font-size: 24px;
	font-weight: 600;
	margin: 0 0 20px;
	padding: 0;
	text-align: center;
 }
 oj-idaas-customer-signin-create-account-section .oj-idaas-employee-signin-app-shell-redwood-container .oj-idaas-customer-signin-create-account-btn.oj-button-primary button {
	background-color: var(--rw-brand-white);
	height: 52px;
	font-size: 18px;
	font-weight: 600;
	border-radius: 5px;
	width: 100%;
	transition: background-color 0.3s linear;
}
oj-idaas-customer-signin-create-account-section .oj-idaas-employee-signin-app-shell-redwood-container .oj-idaas-customer-signin-create-account-btn button:hover {
	background-color: var(--rw-success-dark);

oj-idaas-customer-signin-create-account-section .oj-idaas-customer-signin-create-account-btn,
oj-idaas-customer-signin-create-account-section .oj-idaas-customer-signin-create-account-btn:active {
	font-size: 18px;
    background: transparent;
    color: var(--rw-create-account-text-color);

    font-weight: 600;
    margin: 1px 0;

    display: block;
    text-align: center;

    outline: 0;
    margin: 0;

    text-decoration: none;
    border-color: var(--rw-success);

oj-idaas-customer-signin-create-account-section .oj-idaas-customer-signin-create-account-section-footer {

	content: "";

}.oj-idaas-employee-signin-app-shell-redwood-container {
  --rw-primary: #3C3B3B;
  --rw-success: #759A6C;
  --rw-error: #C54A39;
  --rw-success-dark: #588757;
  --rw-brand-white: #FFFFFF;
  --rw-brand-black: #000000;
  --rw-brand-red: #bb501c;
  --rw-brand-neutral: #FBFAF9;
  --rw-brand-neutral-dark: #ebebeb;
  --rw-link-color: #0572CE;
  --rw-input-label-color: #717171;
  --rw-input-border-color: #C4C4C4;
  --rw-primary-font: "Oracle Sans";
}
@font-face {
  font-display: fallback;
  font-family: "Oracle Sans";
  src: url("commonModule/asset/OracleSansVF.woff2") format("woff2");
}
.oj-idaas-employee-signin-app-shell-redwood-container {
  font-family: var(--rw-primary-font) !important;
  align-items: center;
  background: var(--rw-brand-neutral) url("commonModule/component/layout/ojIdaasEmployeeSigninAppShellRedwood/asset/redwood-theme-bg.jpeg") no-repeat fixed center;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 20px 0px;
}
.oj-idaas-employee-signin-app-shell-redwood-login-card {
  padding: 30px;
  background-color: var(--rw-brand-neutral);
  border-radius: 5px;
  margin: 0 15px;
  width: 460px;
}
.oj-idaas-employee-signin-app-shell-redwood-login-card-top {
  min-height: 385px;
  position: relative;
  height: auto;
  margin-bottom: 25px;
}
.oj-idaas-employee-signin-app-shell-redwood-login-card-title {
  font-size: 30px;
  font-weight: 600;
  margin: 0 0 20px;
  padding: 0;
  text-align: center;
}
.oj-idaas-employee-signin-app-shell-redwood-login-card-content {
  margin-bottom: 30px;
}
.oj-idaas-employee-signin-app-shell-redwood-button-grid-wrapper {
  grid-gap: 20px;
}
.oj-idaas-employee-signin-app-shell-redwood-label {
  color: var(--rw-input-label-color);
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper {
  position: absolute;
  bottom: 30px;
  width: auto;
  height: auto;
  left: 30px;
  margin-bottom: 0;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputtext-input,
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputpassword-input {
  border: 1px solid var(--rw-input-border-color);
  border-radius: 0;
  height: 32px;
  margin: 3px 0 10px 0;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputtext-input:focus,
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputpassword-input:focus {
  border-color: var(--rw-primary) !important;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputtext-input:disabled,
.oj-idaas-employee-signin-app-shell-redwood-container .oj-inputpassword-input:disabled {
  border-color: var(--rw-input-border-color) !important;
}
.oj-idaas-employee-signin-app-shell-redwood-button-grid-wrapper .idcs-signin-common-signin-button {
  margin: 0px;
  height: 32px;
}
.oj-idaas-employee-signin-app-shell-redwood-button-grid-wrapper .idcs-signin-common-signin-button .oj-button-button {
  background-color: var(--rw-brand-white) !important;
  color: var(--rw-brand-black) !important;
  border-color: var(--rw-brand-black) !important;
  border-width: 0.5px;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-button-primary .oj-button-button {
  background-color: var(--rw-success) !important;
  color: var(--rw-brand-white) !important;
  width: 100%;
  font-size: 14px;
  font-weight: 500 !important;
  cursor: pointer;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-button-primary .oj-button-button:not(:disabled):hover {
  background-color: var(--rw-success-dark) !important;
  background-image: none !important;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-label-group label {
  color: var(--rw-input-label-color);
}
.oj-idaas-employee-signin-app-shell-redwood-container .idcs-signin-section-description {
  margin: 0px 0px 15px 0;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-idaas-signin-message-wrapper-error-background {
  border: 1px solid var(--rw-error);
  text-align: center;
  margin-bottom: 10px;
  padding: 5px 10px;
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-idaas-signin-message-wrapper-error-background .oj-idaas-signin-message-content {
  color: var(--rw-error);
}
.oj-idaas-employee-signin-app-shell-redwood-container .oj-idaas-signin-message-wrapper-error-background .idcs-icon.idcs-text-danger {
  display: none;
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper a.idcs-signin-link-button,
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper.oj-button-primary button.oj-button-button {
  background-color: transparent!important;
  border: none;
  color: var(--rw-link-color)!important;
  text-decoration: underline;
  position: relative;
  display: flex;
  flex-direction: row;
  padding-left: 15px;
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper a.idcs-signin-link-button::before,
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper.oj-button-primary button.oj-button-button::before {
  content: '';
  border-right: 1px solid var(--rw-brand-black);
  border-bottom: 1px solid var(--rw-brand-black);
  width: 6px;
  height: 6px;
  transform: rotate(134deg);
  display: inline-block;
  position: absolute;
  left: 2px;
  bottom: 3px;
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper a.idcs-signin-link-button:hover,
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper.oj-button-primary button.oj-button-button:not(:disabled):hover {
  color: var(--rw-link-color)!important;
  background-color: transparent!important;
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper button.oj-button-button .oj-button-label{
  justify-content: left;
}
.oj-idaas-employee-signin-app-shell-redwood-cancel-link-bottom-wrapper button.oj-button-button .oj-button-text{
  padding: 0;
}
.oj-idaas-employee-signin-app-shell-redwood-button-grid-wrapper .idcs-signin-common-signin-button .idcs-icon {
  color: var(--rw-brand-black) !important;
  font-size: 20px;
}

  padding-top: 0;
  margin-top: 5px;
}

  margin: 10px 0;
}

.oj-idaas-signin-app-shell-padding-left-rw {
  padding-left: 50px;
}
.oj-idaas-signin-app-shell-padding-right-rw {
  padding-right: 50px;
}
.oj-idaas-signin-app-shell-branding-logo-wrapper-rw {
  text-align: left;
}
.oj-idaas-signin-app-shell-branding-logo-rw {
  max-width: 250px;
  max-height: 50px;
}
.oj-idaas-signin-app-shell-content-wrapper-rw {
  margin-top: 24px;
}
.headerclass {
  width: 100%;
  background-color: #3A3632;
  background-color: var(--alloy-chBgBase, #3A3632);
  color: #FCFBFA;
  color: var(--alloy-chFgBase, #FCFBFA);
  padding: 15px 20px 0 46px;
  height: 60px;
  font-size: 18px;
  line-height: 30px;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);  
}
.headerText{
  position: relative;
  bottom: 6px;
}
.headerImage{
  height: 26px;
} 
@media all and (max-width: 650px) {
  .oj-idaas-signin-app-shell-rw {
    align-items: flex-start;
  }
  .oj-idaas-signin-app-shell-wrapper-rw {
    margin: 0 0;
    width: 100vw;
    padding: 50px 0px;
  }
  .oj-idaas-signin-app-shell-padding-left-rw {
    padding-left: 17px;
  }
  .oj-idaas-signin-app-shell-padding-right-rw {
    padding-right: 17px;
  }
}
.oj-idaas-login-banner{
  height: 75px;
  width: 584px;
  position: relative;
  top: 22px;
  z-index: 1;
}
.oj-idaas-signin-app-shell-locale-selector-icon {
  font-size: 1.3em;
  position: relative;
  display: inline-block;
  width: 25px;
}
.oj-idaas-signin-app-shell-locale-selector-container {
  padding-left: 50px;
  padding-right: 50px;
  margin-top: 10px;
}
.oj-idaas-signin-app-shell-locale-selector-icon::before {
  content: '\f226';
  position: absolute;
  left: 12%;
  top: 20%;
}
#idcs-signin-language-selector .oj-select {
  max-width: 340px;
  font-size: 0.91em;
}
.oj-listbox-drop[data-oj-containerid="ojChoiceId_idcs-signin-language-selector"] {
  min-width: 320px;
}
#oj-listbox-results-idcs-signin-language-selector {
  font-size: 0.91em;
}
#idcs-signin-language-selector .oj-select-choice {
  background-color: transparent;
  border: none;
}
#idcs-signin-language-selector .oj-select-choice .oj-select-chosen {
  text-align: center;
}
idcs-navigation-drawer:not(.oj-complete) {
  visibility: hidden;
}
idcs-navigation-drawer {
  display: block;
  max-width: 100%;
  width: 100%;
  height: 100%;
  transition: max-width 0.5s;
  transition-property: max-width;
  transition-duration: 0.5s;
  transition-timing-function: initial;
  transition-delay: initial;
  font-size: 1rem;
}
@font-face {
  font-family: 'Navigator Icon Font';
  src: url("commonModule/component/navigation/idcsNavigationDrawer/fonts/nav_iconfont.woff") format("woff");
}
idcs-navigation-drawer.idcs-navigation-drawer-icon-only {
  max-width: 82px;
}
idcs-navigation-drawer.idcs-navigation-drawer-icon-only.oj-offcanvas-open {
  overflow-x: visible;
  overflow-y: visible;
}
idcs-navigation-drawer .idcs-navigation-drawer-outer-container {
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
idcs-navigation-drawer .idcs-navigation-drawer-navigation-list {
  margin-top: 10px;
  flex: 1 1 auto;
}
idcs-navigation-drawer .idcs-navigation-drawer-navigation-list .oj-navigationlist-toolbar {
  display: none;
}
idcs-navigation-drawer.three-tier:not(.drilled-state) .oj-navigationlist-collapsible .oj-navigationlist-expand-icon:before {
  transform: rotate(90deg);
}
html:not([dir="rtl"]) idcs-navigation-drawer.three-tier:not(.drilled-state) .oj-navigationlist-collapsible .oj-navigationlist-collapse-icon:before {
  transform: rotate(0deg);
}
html[dir="rtl"] idcs-navigation-drawer.three-tier:not(.drilled-state) .oj-navigationlist-collapsible .oj-navigationlist-collapse-icon:before {
  transform: rotate(180deg);
}
idcs-navigation-drawer .oj-contrast-marker .idcs-navigation-drawer-navigation-list .oj-navigationlist-item-element.oj-expanded {
  background-color: #1f2021;
}
idcs-navigation-drawer .idcs-navigation-drawer-navigation-list .oj-navigationlist-item-element {
  
  list-style-image: none;
}
idcs-navigation-drawer .oj-contrast-marker .idcs-navigation-drawer-navigation-list .oj-navigationlist-item.oj-selected {
  background-color: transparent;
}
idcs-navigation-drawer .idcs-navigation-drawer-navigation-list .oj-navigationlist-item.oj-selected a.oj-navigationlist-item-content {

        <div class="idcs-gov-banner-container" :class="[[{'idcs-gov-banner-visible': isGovNofornRegion}]]">
          <div class="idcs-gov-banner red top">
          <span>
            <oj-bind-text value="[[bundle('signin.gov.nofornBanner')]]"></oj-bind-text>
          </span>
          </div>
        </div>
      </oj-bind-if>
      <oj-bind-if test="[[isGovRegion &amp;&amp; !isGovNofornRegion]]">
        <div class="idcs-gov-banner-container" :class="[[{'idcs-gov-banner-visible': isGovRegion}]]">
          <div class="idcs-gov-banner yellow top">
            <span>
              <oj-bind-text value="[[bundle('signin.gov.banner')]]"></oj-bind-text>
            </span>
          </div>
        </div>
      </oj-bind-if>
      
      <oj-bind-if test="[[isMultiRegionLoginFeatureEnabled &amp;&amp; isHomeRegionDown]]">
        <div id="home-region-down-banner">
          <oj-messages messages="[[messagesDataProvider]]" position="[[position]]" class="oj-pending-subtree-hidden"></oj-messages>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[!isRedwood &amp;&amp; !isOracleEmployeeRedwood &amp;&amp; !isCustomerRedwood]]">
        <oj-idaas-signin-app-shell data-oj-context="" id="idcs-app-shell" branding-logo="[[brandingLogo]]" custom-branding="[[customBranding]]" background-image="[[brandingBackgroundImage]]" announce-migration="[[isMigrationAnnounced]]" announce-mfa-policy-update="[[isMfaPolicyAnnounced]]">
          <div slot="content">
            <oj-module role="main" config="[[moduleConfig]]" class="oj-pending-subtree-hidden"></oj-module>
          </div>
        </oj-idaas-signin-app-shell>
      </oj-bind-if>

      <oj-bind-if test="[[isOracleEmployeeRedwood || isCustomerRedwood]]">
        <oj-idaas-employee-signin-app-shell-redwood data-oj-context="" id="idcs-app-shell" branding-logo="[[brandingLogo]]" custom-branding="[[customBranding]]" background-image="[[brandingBackgroundImage]]">
          <div slot="content">
            <oj-module role="main" config="[[moduleConfig]]" class="oj-pending-subtree-hidden"></oj-module>
          </div>
        </oj-idaas-employee-signin-app-shell-redwood>
      </oj-bind-if>

      <oj-bind-if test="[[isRedwood]]">
        <oj-idaas-signin-app-shell-rw data-oj-context="" id="idcs-app-shell" branding-logo="[[brandingLogo]]" custom-branding="[[customBranding]]" background-image="[[brandingBackgroundImage]]" announce-mfa-policy-update="[[isMfaPolicyAnnounced]]" language-options="[[languageOptions]]">
          <div slot="content">
            <oj-module role="main" config="[[moduleConfig]]" class="oj-pending-subtree-hidden"></oj-module>
          </div>
        </oj-idaas-signin-app-shell-rw>
      </oj-bind-if>
      <oj-bind-if test="[[isGovNofornRegion]]">
        <div class="idcs-gov-banner-container" :class="[[{'idcs-gov-banner-visible': isGovNofornRegion}]]">
          <div class="idcs-gov-banner red bottom">
          <span>
            <oj-bind-text value="[[bundle('signin.gov.nofornBanner')]]"></oj-bind-text>
          </span>
          </div>
        </div>
      </oj-bind-if>
      <oj-bind-if test="[[isGovRegion &amp;&amp; !isGovNofornRegion]]">
        <div class="idcs-gov-banner-container" :class="[[{'idcs-gov-banner-visible': isGovRegion}]]">
          <div class="idcs-gov-banner yellow bottom">
            <span>
              <oj-bind-text value="[[bundle('signin.gov.banner')]]"></oj-bind-text>
            </span>
          </div>
        </div>
      </oj-bind-if>
    </div>
  

</body></html>
